---
name: Skill Quality Review (Tessl)

'on':
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '**/SKILL.md'
      - '**/scripts/*.py'

concurrency:
  group: quality-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  detect-skills:
    name: Detect changed skills
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      skills: ${{ steps.find.outputs.skills }}
      has_skills: ${{ steps.find.outputs.has_skills }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Find changed skill directories
        id: find
        run: |
          # -z gives NUL-delimited, raw (never C-quoted) paths so directory
          # names containing quotes, backslashes, tabs, or newlines aren't
          # silently mangled and skipped by the checks below.
          mapfile -d '' -t CHANGED_FILES < <(git diff --name-only -z origin/${{ github.base_ref }}...HEAD 2>/dev/null || true)
          if [ ${#CHANGED_FILES[@]} -eq 0 ]; then
            echo "skills=[]" >> "$GITHUB_OUTPUT"
            echo "has_skills=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          SKILLS=()
          declare -A SEEN=()
          for file in "${CHANGED_FILES[@]}"; do
            # Get the top-level directory (first two "/"-delimited
            # components). Done with pure bash substring expansion, never a
            # line-oriented tool like `cut`, because a path can legally
            # contain an embedded newline byte — a line-oriented tool would
            # split such a path across two "lines" and silently miscompute
            # `dir`, letting a malicious/malformed skill escape the review.
            first="${file%%/*}"
            if [ "$first" = "$file" ]; then
              dir="$file"
            else
              rest="${file#*/}"
              dir="$first/${rest%%/*}"
            fi
            case "$dir" in
              .github/*|.claude/*|.codex/*|.gemini/*|docs/*|scripts/*|commands/*|standards/*|eval-workspace/*|medium/*) continue ;;
            esac
            for candidate in "$dir"; do
              if [ -f "$candidate/SKILL.md" ]; then
                # Reject anything outside a safe, portable charset instead
                # of trying to thread arbitrary bytes (newlines, control
                # characters, quotes, spaces) through every downstream
                # shell/JSON/Markdown/log-annotation consumer. Fail the
                # job loudly so a human looks at it, rather than silently
                # skipping it (which would let that directory's contents
                # dodge the review entirely) or passing the raw bytes
                # through (which reopens the exact class of injection this
                # workflow exists to close, e.g. GitHub Actions workflow
                # commands via an embedded newline).
                if ! [[ "$candidate" =~ ^[A-Za-z0-9._-]+/[A-Za-z0-9._-]+$ ]]; then
                  echo "::error::Skill directory name uses unsupported characters, refusing to review: $(printf '%q' "$candidate")" >&2
                  exit 1
                fi
                # Exact-key associative-array lookup, not a joined-string
                # regex match: `${SEEN[*]}` substring matching would let a
                # crafted directory name falsely collide with an unrelated
                # candidate and skip it from the review.
                if [ -z "${SEEN[$candidate]+x}" ]; then
                  SKILLS+=("$candidate")
                  SEEN[$candidate]=1
                  break
                fi
              fi
            done
          done

          if [ ${#SKILLS[@]} -eq 0 ]; then
            echo "skills=[]" >> "$GITHUB_OUTPUT"
            echo "has_skills=false" >> "$GITHUB_OUTPUT"
          else
            # Build JSON array with a real serializer so directory names
            # containing quotes, backslashes, or shell metacharacters can
            # never break out of the JSON string.
            JSON=$(python3 -c 'import json,sys; print(json.dumps(sys.argv[1:]))' "${SKILLS[@]}")
            echo "skills=$JSON" >> "$GITHUB_OUTPUT"
            echo "has_skills=true" >> "$GITHUB_OUTPUT"
            echo "Changed skills: $JSON"
          fi

  review:
    name: Tessl quality review
    needs: detect-skills
    if: needs.detect-skills.outputs.has_skills == 'true'
    runs-on: ubuntu-latest
    # TESSL_TOKEN secret lives in the environment of the same name.
    environment: TESSL_TOKEN
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.11'

      - name: Verify Tessl token is configured
        env:
          TESSL_TOKEN: ${{ secrets.TESSL_TOKEN }}
          TESSL_API_KEY: ${{ secrets.TESSL_API_KEY }}
          TESSL_TOKEN_AS_VAR: ${{ vars.TESSL_TOKEN }}
        run: |
          if [ -n "$TESSL_TOKEN" ]; then
            echo "TESSL_TOKEN secret: present (${#TESSL_TOKEN} chars)"
          elif [ -n "$TESSL_TOKEN_AS_VAR" ]; then
            echo "::error::TESSL_TOKEN is registered under the Variables tab, not Secrets." \
              "Delete the variable and re-add it as a Repository secret" \
              "(Settings → Secrets and variables → Actions → Secrets tab → New repository secret)."
            exit 1
          elif [ -n "$TESSL_API_KEY" ]; then
            echo "::error::Secret TESSL_API_KEY exists but this workflow expects TESSL_TOKEN." \
              "Rename it: Settings → Secrets and variables → Actions → Repository secrets."
            exit 1
          else
            echo "::error::TESSL_TOKEN is missing or empty in this repository's Actions secrets." \
              "Add it under Settings → Secrets and variables → Actions → Repository secrets" \
              "(not Variables, not Codespaces/Dependabot, not Environments)."
            exit 1
          fi

      - name: Set up Tessl CLI
        uses: tesslio/setup-tessl@25ec223fc0da33b41b8044ff5ab2b85235f4f91e
        with:
          token: ${{ secrets.TESSL_TOKEN }}

      - name: Review changed skills
        id: review
        env:
          # Passed as an env var (never interpolated into the run: script
          # body) so a malicious skill directory name cannot inject shell
          # commands via GitHub Actions expression substitution.
          SKILLS_JSON: ${{ needs.detect-skills.outputs.skills }}
        run: |
          REPORT_FILE=$(mktemp)
          OVERALL_EXIT=0
          THRESHOLD=70

          echo "## 📊 Skill Quality Review (Tessl)" > "$REPORT_FILE"
          echo "" >> "$REPORT_FILE"
          echo "| Skill | Score | Description | Content | Verdict |" >> "$REPORT_FILE"
          echo "|-------|-------|-------------|---------|---------|" >> "$REPORT_FILE"

          DETAILS_FILE=$(mktemp)

          # Read NUL-delimited (no word splitting, glob expansion, *or*
          # line splitting) so paths with spaces, or even an embedded
          # newline byte, are never mangled or split into extra, incorrect
          # entries.
          while IFS= read -r -d '' skill_dir; do
            echo "::group::Reviewing $skill_dir"

            JSON_OUT=$(tessl skill review "$skill_dir" --json 2>&1) && EXIT_CODE=$? || EXIT_CODE=$?

            # Parse results
            PARSED=$(echo "$JSON_OUT" | python3 -c "
          import sys, json
          try:
              # tessl prints a Terms banner before the JSON; parse from the first '{'
              text = sys.stdin.read()
              d = json.loads(text[text.index('{'):])
              score = d.get('review', {}).get('reviewScore', 0)
              ds = round(d.get('descriptionJudge', {}).get('normalizedScore', 0) * 100)
              cs = round(d.get('contentJudge', {}).get('normalizedScore', 0) * 100)
              passed = d.get('validation', {}).get('overallPassed', False)
              name = d.get('validation', {}).get('skillName', 'unknown')

              # Collect suggestions
              desc_suggestions = d.get('descriptionJudge', {}).get('evaluation', {}).get('suggestions', [])
              content_suggestions = d.get('contentJudge', {}).get('evaluation', {}).get('suggestions', [])

              suggestions = []
              for s in desc_suggestions:
                  suggestions.append(f'[description] {s}')
              for s in content_suggestions:
                  suggestions.append(f'[content] {s}')

              print(f'{name}|{score}|{ds}|{cs}|{\"PASS\" if passed else \"FAIL\"}|{json.dumps(suggestions)}')
          except Exception as e:
              print(f'unknown|0|0|0|ERROR|[]')
          " 2>/dev/null || echo "unknown|0|0|0|ERROR|[]")

            IFS='|' read -r NAME SCORE DS CS VSTATUS SUGGESTIONS <<< "$PARSED"

            # Determine verdict
            if [ "$SCORE" -ge "$THRESHOLD" ]; then
              ICON="✅"
              VERDICT="PASS"
            else
              ICON="⚠️"
              VERDICT="NEEDS WORK"
              OVERALL_EXIT=1
            fi

            echo "| \`$skill_dir\` | **${SCORE}/100** ${ICON} | ${DS}% | ${CS}% | ${VERDICT} |" >> "$REPORT_FILE"

            # Add suggestions as details
            SUGG_COUNT=$(echo "$SUGGESTIONS" | python3 -c "import sys,json; print(len(json.loads(sys.stdin.readline())))" 2>/dev/null || echo "0")
            if [ "$SUGG_COUNT" -gt 0 ]; then
              echo "" >> "$DETAILS_FILE"
              echo "### \`$skill_dir\` — ${SCORE}/100" >> "$DETAILS_FILE"
              echo "" >> "$DETAILS_FILE"
              echo "$SUGGESTIONS" | python3 -c "
          import sys, json
          suggestions = json.loads(sys.stdin.readline())
          for s in suggestions:
              print(f'- {s}')
          " >> "$DETAILS_FILE"
            fi

            echo "::endgroup::"
          done < <(printf '%s' "$SKILLS_JSON" | python3 -c "import sys,json; [sys.stdout.write(s + chr(0)) for s in json.load(sys.stdin)]")

          # Add details section
          DETAILS_CONTENT=$(cat "$DETAILS_FILE")
          if [ -n "$DETAILS_CONTENT" ]; then
            echo "" >> "$REPORT_FILE"
            echo "<details><summary>Improvement suggestions</summary>" >> "$REPORT_FILE"
            echo "" >> "$REPORT_FILE"
            cat "$DETAILS_FILE" >> "$REPORT_FILE"
            echo "" >> "$REPORT_FILE"
            echo "</details>" >> "$REPORT_FILE"
          fi

          echo "" >> "$REPORT_FILE"
          echo "_Threshold: ${THRESHOLD}/100 — skills below this score need improvement before merge._" >> "$REPORT_FILE"

          echo "report_file=$REPORT_FILE" >> "$GITHUB_OUTPUT"
          echo "exit_code=$OVERALL_EXIT" >> "$GITHUB_OUTPUT"

      - name: Run internal validators
        id: internal
        env:
          # Passed as an env var (never interpolated into the run: script
          # body) so a malicious skill directory name cannot inject shell
          # commands via GitHub Actions expression substitution.
          SKILLS_JSON: ${{ needs.detect-skills.outputs.skills }}
        run: |
          INTERNAL_REPORT=$(mktemp)
          INTERNAL_EXIT=0

          echo "" >> "$INTERNAL_REPORT"
          echo "## 🔧 Internal Validation" >> "$INTERNAL_REPORT"
          echo "" >> "$INTERNAL_REPORT"

          # Read NUL-delimited (no word splitting, glob expansion, *or*
          # line splitting) so paths with spaces, or even an embedded
          # newline byte, are never mangled or split into extra, incorrect
          # entries.
          while IFS= read -r -d '' skill_dir; do
            # Structure validation
            STRUCT=$(python3 engineering/skill-tester/scripts/skill_validator.py "$skill_dir" --json 2>&1 | python3 -c "
          import sys, json
          try:
              d = json.load(sys.stdin)
              print(f'{d[\"overall_score\"]}|{d[\"compliance_level\"]}')
          except:
              print('0|ERROR')
          " 2>/dev/null || echo "0|ERROR")
            IFS='|' read -r SSCORE SLEVEL <<< "$STRUCT"

            # Script testing (if scripts exist)
            SCRIPT_STATUS="N/A"
            if [ -d "$skill_dir/scripts" ] && ls "$skill_dir/scripts/"*.py >/dev/null 2>&1; then
              STEST=$(python3 engineering/skill-tester/scripts/script_tester.py "$skill_dir" --json 2>&1 | python3 -c "
          import sys, json
          text = sys.stdin.read()
          try:
              start = text.index('{')
              d = json.loads(text[start:])
              print(f'{d[\"summary\"][\"passed\"]}/{d[\"summary\"][\"total_scripts\"]} PASS')
          except:
              print('ERROR')
          " 2>/dev/null || echo "ERROR")
              SCRIPT_STATUS="$STEST"
            fi

            # Security audit
            SEC=$(python3 engineering/skill-security-auditor/scripts/skill_security_auditor.py "$skill_dir" --strict --json 2>&1 | python3 -c "
          import sys, json
          try:
              d = json.load(sys.stdin)
              print(f'{d[\"verdict\"]}')
          except:
              print('ERROR')
          " 2>/dev/null || echo "ERROR")

            # Fail closed: only a confirmed PASS or WARN verdict is safe to
            # let through. Previously this only checked for the literal
            # "FAIL" verdict, so if the auditor itself errored out (crash,
            # timeout, malformed/non-JSON output -- anything the inner
            # `except: print('ERROR')` above catches) SEC became "ERROR"
            # and silently passed this gate: the security audit couldn't
            # even run, but the quality-review job still reported success.
            case "$SEC" in
              PASS|WARN) ;;
              *) INTERNAL_EXIT=1 ;;
            esac

            echo "- \`$skill_dir\`: structure ${SSCORE}/100 (${SLEVEL}), scripts ${SCRIPT_STATUS}, security ${SEC}" >> "$INTERNAL_REPORT"
          done < <(printf '%s' "$SKILLS_JSON" | python3 -c "import sys,json; [sys.stdout.write(s + chr(0)) for s in json.load(sys.stdin)]")

          echo "internal_report=$INTERNAL_REPORT" >> "$GITHUB_OUTPUT"
          echo "internal_exit=$INTERNAL_EXIT" >> "$GITHUB_OUTPUT"

      - name: Post review as PR comment
        if: always()
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        with:
          script: |
            const fs = require('fs');
            let body = '';
            try {
              body += fs.readFileSync('${{ steps.review.outputs.report_file }}', 'utf8');
            } catch (e) {
              body += '## 📊 Skill Quality Review\n\nNo Tessl report generated.\n';
            }
            try {
              body += '\n' + fs.readFileSync('${{ steps.internal.outputs.internal_report }}', 'utf8');
            } catch (e) {}

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const marker = '## 📊 Skill Quality Review';
            const existing = comments.find(c => c.body.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body: body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: body,
              });
            }

      - name: Fail on low quality or security issues
        if: steps.review.outputs.exit_code == '1' || steps.internal.outputs.internal_exit == '1'
        run: |
          if [ "${{ steps.internal.outputs.internal_exit }}" = "1" ]; then
            echo "::error::Internal security audit did not return a clean PASS/WARN verdict" \
              "for one or more changed skills (either it found CRITICAL/HIGH findings, or it" \
              "could not run to completion). See the internal validation report above." \
              "Merge blocked."
          fi
          if [ "${{ steps.review.outputs.exit_code }}" = "1" ]; then
            echo "::error::Tessl quality review below threshold (70/100). Improve skill before merge."
          fi
          exit 1
