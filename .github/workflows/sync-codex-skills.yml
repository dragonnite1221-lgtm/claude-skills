---
name: Sync Codex Skills Symlinks

on:
  push:
    paths:
      - '**/SKILL.md'
      - 'scripts/sync-codex-skills.py'
    branches:
      - main
      - dev
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (no changes)'
        required: false
        default: false
        type: boolean

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
          token: ${{ github.token }}

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.11'

      - name: Sync Codex skills symlinks
        env:
          DRY_RUN: ${{ github.event.inputs.dry_run }}
        run: |
          if [ "$DRY_RUN" == "true" ]; then
            python scripts/sync-codex-skills.py --verbose --dry-run
          else
            python scripts/sync-codex-skills.py --verbose --validate
          fi

      - name: Check for changes
        id: check_changes
        run: |
          if git diff --quiet .codex/; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Configure authenticated push (dev only)
        if: steps.check_changes.outputs.has_changes == 'true' && github.event.inputs.dry_run != 'true' && github.ref != 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Keep checkout credentials disabled. Supply the short-lived job token
          # only when git asks for credentials during the automated push.
          git config --local credential.helper \
            "!f() { test \"\$1\" = get || exit 0; echo username=x-access-token; echo \"password=\$GH_TOKEN\"; }; f"

      - name: Commit changes (dev only)
        if: steps.check_changes.outputs.has_changes == 'true' && github.event.inputs.dry_run != 'true' && github.ref != 'refs/heads/main'
        uses: stefanzweifel/git-auto-commit-action@b863ae1933cb653a53c021fe36dbb774e1fb9403
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          commit_message: "chore: sync codex skills symlinks [automated]"
          file_pattern: ".codex/*"
          commit_user_name: "github-actions[bot]"
          commit_user_email: "github-actions[bot]@users.noreply.github.com"

      - name: Clear push authentication helper
        if: always()
        run: git config --local --unset-all credential.helper || true

      - name: Warn if main has drift
        if: steps.check_changes.outputs.has_changes == 'true' && github.ref == 'refs/heads/main'
        run: |
          echo "::warning::Codex skills symlinks are out of sync on main. Run the sync on dev and merge via PR."

      - name: Summary
        run: |
          {
            echo "## Codex Skills Sync Summary"
            echo ""
            if [ -f ".codex/skills-index.json" ]; then
              TOTAL=$(python3 -c "import json; print(json.load(open('.codex/skills-index.json'))['total_skills'])")
              echo "**Total Skills:** $TOTAL"
              echo ""
              echo "### Categories"
              python3 -c "
          import json
          data = json.load(open('.codex/skills-index.json'))
          for cat, info in data['categories'].items():
              print(f'- **{cat}**: {info[\"count\"]} skills')
          "
            else
              echo "No skills index found."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
