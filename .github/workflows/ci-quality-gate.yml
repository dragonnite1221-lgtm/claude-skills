---
name: CI Quality Gate

'on':
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      ref:
        description: Branch to run quality gate against
        required: false
  repository_dispatch:
    types: [ci-quality]

concurrency:
  group: quality-gate-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, Tests, Docs, Security
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 25
    steps:
      - name: Resolve ref
        id: ref
        env:
          EVENT_NAME: ${{ github.event_name }}
          WORKFLOW_REF: ${{ github.event.inputs.ref }}
          DISPATCH_REF: ${{ github.event.client_payload.ref }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          FALLBACK_REF: ${{ github.head_ref || github.ref_name }}
        run: |
          write_target_ref() {
            local target_ref="$1"
            if [[ -z "$target_ref" || "$target_ref" == *$'\n'* || "$target_ref" == *$'\r'* ]]; then
              echo "Invalid target ref" >&2
              exit 1
            fi
            printf 'target_ref=%s\n' "$target_ref" >> "$GITHUB_OUTPUT"
          }

          if [[ "$EVENT_NAME" == "workflow_dispatch" && -n "$WORKFLOW_REF" ]]; then
            write_target_ref "$WORKFLOW_REF"
          elif [[ "$EVENT_NAME" == "repository_dispatch" && -n "$DISPATCH_REF" ]]; then
            write_target_ref "$DISPATCH_REF"
          elif [[ "$EVENT_NAME" == "pull_request" ]]; then
            # Use commit SHA for PRs — branch names from forks don't exist in the base repo
            write_target_ref "$PR_HEAD_SHA"
          else
            write_target_ref "$FALLBACK_REF"
          fi

      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ steps.ref.outputs.target_ref }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install tooling
        run: |
          python -m pip install --upgrade pip
          pip install yamllint==1.35.1 check-jsonschema==0.28.4 pip-audit==2.10.1
          pip install -r requirements-dev.txt

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20

      - name: YAML lint (.github/workflows)
        run: |
          # yamllint cannot properly parse JavaScript template literals in YAML
          # Skip pr-issue-auto-close.yml which contains complex template strings
          find .github/workflows -name "*.yml" ! -name "pr-issue-auto-close.yml" -exec yamllint -d '{extends: default, rules: {line-length: {max: 160}}}' {} +

      - name: Validate GitHub workflow schemas
        run: |
          # Exclude pr-issue-auto-close.yml (complex JS template literals cause parsing errors)
          # Exclude smart-sync.yml (uses projects_v2_item event not yet in official schema)
          find .github/workflows -name "*.yml" \
            ! -name "pr-issue-auto-close.yml" \
            ! -name "smart-sync.yml" \
            -exec check-jsonschema --builtin-schema github-workflows {} +

      # Blocking quality gates run through scripts/check.sh so that a local
      # `bash scripts/check.sh` exercises exactly what CI does
      # (FLEET_QUALITY_INVARIANTS.md, Invariant 2: local == CI). This single
      # step covers: Python syntax, frontmatter + Gemini mirror gate,
      # inventory drift gate, and the test suite.
      - name: Quality gates (syntax, frontmatter, mirror, inventory, tests)
        run: bash scripts/check.sh

      - name: Dependency vulnerability audit (requirements*.txt)
        run: |
          set -e
          files=$(find . -name "requirements*.txt" 2>/dev/null || true)
          if [[ -z "$files" ]]; then
            echo "No requirements files found; skipping safety scan."
            exit 0
          fi
          for f in $files; do
            echo "Auditing $f"
            pip-audit --requirement "$f"
          done

      - name: Markdown link spot-check
        run: |
          # Non-blocking: external links (claude.ai) may timeout, anchor links can't be validated
          npx --yes markdown-link-check@3.12.2 README.md || true

      - name: Summarize results
        if: always()
        run: |
          echo "Quality gate completed with status: ${{ job.status }}"
